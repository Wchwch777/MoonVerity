name: Publish Mooncakes package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Prepublish verification
        run: |
          moon version --all
          moon update
          moon fmt
          git diff --exit-code
          moon check --deny-warn --target all
          moon build --deny-warn --target all
          moon test --deny-warn --target wasm-gc
          moon info
          git diff --exit-code
          python scripts/verify_benchmark.py
          python scripts/check_repo_compliance.py --skip-remote-sync

      - name: Publish
        env:
          SECRET: ${{ secrets.MOONCAKES_PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_PUBLISH_TOKEN secret is not set."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          moon publish
          rm -f "$HOME/.moon/credentials.json"
