name: Check and Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MOONBIT_INSTALL_VERSION: 0.10.3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install MoonBit and native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit and native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc openssl
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install MSYS2 native dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl

      - name: Post-install verification
        run: |
          moon version --all 2>&1 | tee moon-version.txt
          grep -q "moonc v0.10.3" moon-version.txt
          moon update

      - name: Format check
        run: |
          moon version --all
          moon fmt --verbose
          fmt_status=$?
          echo "formatter_exit=$fmt_status"
          git status --short
          git diff --stat
          if [ "$fmt_status" -ne 0 ]; then
            exit "$fmt_status"
          fi
          git diff --exit-code

      - name: Type check all targets
        run: moon check --deny-warn --target all

      - name: Build all targets
        run: moon build --deny-warn --target all

      - name: Generate and verify public interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Test wasm-gc with coverage
        run: |
          moon test --deny-warn --target wasm-gc --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

      - name: Test native with coverage
        run: |
          moon test --deny-warn --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

      - name: Verify CLI exits and repository compliance
        run: |
          python scripts/verify_cli_exit.py
          python scripts/verify_benchmark.py
          python scripts/check_repo_compliance.py --skip-remote-sync
